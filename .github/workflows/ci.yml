name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    name: Go checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      # frontend/dist is generated by wails build and not committed, but the
      # root package's //go:embed all:frontend/dist needs it to exist.
      - name: Scaffold embed assets
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/.gitkeep -Value ""

      - name: Run vet
        run: go vet ./...

      - name: Generate PCI ID database
        run: go generate ./pkg/sysinfo/...

      - name: Run tests
        run: go test ./pkg/...

  frontend-test:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: "frontend/package.json"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Generates auto-imports.d.ts, components.d.ts, typed-router.d.ts and
      # node_modules/.nuxt-ui/ui — all gitignored, but required by type-check.
      - name: Run build
        run: npm run build-only

      - name: Run type-check
        run: npm run type-check

      - name: Run tests
        run: npm test
