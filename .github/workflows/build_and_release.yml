name: Create Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: markmybytes/install-it/.github/workflows/test.yml@main

  build:
    needs: test
    runs-on: windows-latest
    env:
      BUILD_NAME: windows-x64
      WV2_ARCH: x64
      WV2_VERSION: "151.0.4129.107"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install Wails CLI
        run: |
          $WAILS_VERSION = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION

      - name: Set up Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/package.json'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install NPM dependencies
        working-directory: frontend
        run: npm ci

      - name: Build binary for Windows (amd64)
        env:
          GOARCH: amd64
        run: |
          wails build -ldflags "-X main.buildVersion=${{ github.ref_name }}"

      - name: Download and extract WebView2 runtime
        working-directory: build/bin
        run: |
          curl -o webview2.nupkg -L "https://globalcdn.nuget.org/packages/webview2.runtime.${{ env.WV2_ARCH }}.${{ env.WV2_VERSION }}.nupkg?packageVersion=${{ env.WV2_VERSION }}"
          New-Item -ItemType Directory -Force -Path internals\bin | Out-Null
          7z x webview2.nupkg -oext -y
          Move-Item -Force ext\contentFiles\any\any\WebView2 internals\bin\WebView2
          Remove-Item -Recurse -Force ext
          Remove-Item -Force webview2.nupkg

      - name: Download internal data files
        working-directory: build/bin
        run: |
          $d = "internals\data"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Invoke-WebRequest -Uri https://pci-ids.ucw.cz/v2.2/pci.ids.gz -OutFile "$d\pci.ids.gz"
          Invoke-WebRequest -Uri https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe -OutFile "$d\PawnIO_setup.exe"
          Invoke-WebRequest -Uri https://github.com/namazso/PawnIO.Modules/releases/download/0.2.10/release_0_2_10.zip -OutFile "$d\pawnio_modules.zip"
          Expand-Archive -Path "$d\pawnio_modules.zip" -DestinationPath "$d\pawnio_modules" -Force
          Move-Item "$d\pawnio_modules\IntelMSR.bin", "$d\pawnio_modules\RyzenSMU.bin" $d
          Remove-Item "$d\pawnio_modules.zip"
          Remove-Item -Recurse "$d\pawnio_modules"

      - name: Bundle binary and WebView2 files into ZIP
        working-directory: build/bin
        run: |
          7z a install-it.${{ env.BUILD_NAME }}.zip install-it.exe internals\data -mx8
          7z a install-it.${{ env.BUILD_NAME }}-bundled.zip install-it.exe internals -mx8

      - name: Collect artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-amd64
          path: build/bin/*.zip

  build-updater:
    needs: test
    runs-on: windows-latest
    env:
      BUILD_NAME: windows-x64

    steps:
      - name: Checkout updater repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/install-it-updater

      - name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Build the executable
        run: |
          pyinstaller .\src\main.py -cDF -n updater.${{ env.BUILD_NAME }} -i .\icon.ico

      - name: Upload updater artifact
        uses: actions/upload-artifact@v7
        with:
          name: updater-x64
          path: dist/updater.${{ env.BUILD_NAME }}.exe

  release:
    needs: [build, build-updater]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create release with artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
